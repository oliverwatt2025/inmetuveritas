name: Daily macro update (FRED + Stooq)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC every day

permissions:
  contents: write

concurrency:
  group: update-indicators
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install archive test dependency
        run: python3 -m pip install "cryptography>=43,<47"

      - name: Run updater script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python3 scripts/update_indicators.py

      - name: Validate intelligence engine
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Refresh dated five-year observations (preserve existing data on feed failures)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/backfill_history_5y.py

      - name: Generate daily market intelligence
        run: python3 scripts/generate_intelligence.py

      - name: Select evidence-backed daily commentary (AI optional)
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/generate_ai_commentary.py

      - name: Validate generated report
        run: python3 -m json.tool public/market_intelligence.json > /dev/null

      - name: Commit & push indicators.json (if changed)
        run: |
          git config user.name "inmetuveritas-bot"
          git config user.email "actions@users.noreply.github.com"

          # ✅ Add daily history file so it gets published to live
          git add public/indicators.json public/history_weekly.ndjson public/history_daily.ndjson public/market_intelligence.json
          if test -f public/history_5y.ndjson; then git add public/history_5y.ndjson; fi

          # If nothing changed, exit cleanly
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily macro update"
          git push
