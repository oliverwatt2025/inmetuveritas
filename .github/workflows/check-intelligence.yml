name: Market intelligence prototype checks
on:
  push:
    branches:
      - market-intelligence-foundation
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test evidence engine
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate sample intelligence report
        run: python3 scripts/generate_intelligence.py
      - name: Validate report JSON
        run: python3 -m json.tool public/market_intelligence.json > /dev/null
